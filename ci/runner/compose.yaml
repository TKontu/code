# Self-hosted GitHub Actions runner, for jobs that must reach services on
# your LAN (e.g. pushing to a private registry). Run it on a host with Docker.
#
#   cp .env.example .env    # fill it in, then: chmod 600 .env
#   docker compose up -d
#   docker compose logs -f  # wait for "Listening for Jobs"
#
# Read README.md first: a runner with the Docker socket is root on its host.

name: github-runner

services:
  runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_SCOPE: repo
      # Jobs run in this path on the HOST too (see the bind mount below), so
      # bind mounts that jobs pass to the host's Docker daemon resolve.
      RUNNER_WORKDIR: /tmp/github-runner/work
      # Keeps the registration across container restarts and upgrades.
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data
      DISABLE_AUTO_UPDATE: "true"
    volumes:
      # Jobs build and push images through the host's Docker daemon, which
      # also keeps its layer cache between runs.
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/github-runner:/tmp/github-runner
      - runner-data:/runner/data

volumes:
  runner-data:
