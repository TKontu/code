# Build starters/devbox and push it to a private registry, from a
# self-hosted runner that can reach it (see ci/runner/).
#
# Repository settings this reads:
#   variables  REGISTRY             registry host[:port]
#              DEVBOX_IMAGE_NAME    path in the registry, e.g. <owner>/devbox
#              DEVBOX_BASE_IMAGE    optional, default ubuntu:24.04
#              DEVBOX_TORCH_INDEX   optional, default the CPU wheel index
#   secrets    REGISTRY_USERNAME, REGISTRY_TOKEN (needs package write)
#
# Tags pushed: YYYY-MM-DD (UTC build date), sha-<short>, latest.

name: devbox image

# Never add pull_request or pull_request_target. This runs on a self-hosted
# runner with the host's Docker socket; code from a fork must not reach it.
on:
  push:
    branches: [main]
    paths:
      - starters/devbox/**
      - .github/workflows/devbox-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devbox-image
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: [self-hosted, docker-builder]
    timeout-minutes: 180
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      IMAGE_NAME: ${{ vars.DEVBOX_IMAGE_NAME }}
      BASE_IMAGE: ${{ vars.DEVBOX_BASE_IMAGE || 'ubuntu:24.04' }}
      TORCH_INDEX_URL: ${{ vars.DEVBOX_TORCH_INDEX || 'https://download.pytorch.org/whl/cpu' }}
    steps:
      - name: Check settings
        run: |
          missing=""
          [ -n "$REGISTRY" ]   || missing="$missing variable:REGISTRY"
          [ -n "$IMAGE_NAME" ] || missing="$missing variable:DEVBOX_IMAGE_NAME"
          [ "${{ secrets.REGISTRY_USERNAME != '' }}" = "true" ] || missing="$missing secret:REGISTRY_USERNAME"
          [ "${{ secrets.REGISTRY_TOKEN != '' }}" = "true" ] || missing="$missing secret:REGISTRY_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Log in to registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          tags="$(date -u +%F) sha-${GITHUB_SHA::7} latest"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "TAGS=$tags"   >> "$GITHUB_ENV"
          tag_args=""
          for t in $tags; do tag_args="$tag_args -t $image:$t"; done
          docker build \
            --pull \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg TORCH_INDEX_URL="$TORCH_INDEX_URL" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            $tag_args \
            starters/devbox

      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh "$IMAGE:latest" -c \
            'gh --version && git --version && python --version && test -f /etc/ssh/sshd_config.d/10-devbox.conf && test -x /usr/local/bin/devbox-entrypoint'

      # The uv wrapper is what keeps virtualenvs off a /work network share.
      # It fails silently and expensively if it ever stops resolving, so
      # assert the redirect rather than just its presence.
      - name: Smoke test - uv wrapper redirects /work virtualenvs
        run: |
          docker run --rm --entrypoint sh "$IMAGE:latest" -c '
            set -eu
            test -x /usr/local/lib/uv/uv || { echo "real uv missing"; exit 1; }
            uv --version >/dev/null || { echo "wrapper does not reach real uv"; exit 1; }

            # Stub the real uv so we can read back what the wrapper exported.
            mv /usr/local/lib/uv/uv /usr/local/lib/uv/uv.real
            printf "#!/bin/sh\necho \"\${UV_PROJECT_ENVIRONMENT:-unset}\"\n" > /usr/local/lib/uv/uv
            chmod 0755 /usr/local/lib/uv/uv

            mkdir -p /work/demo /local/demo
            touch /work/demo/pyproject.toml /local/demo/pyproject.toml

            got=$(cd /work/demo && uv run true)
            case "$got" in
              /home/dev/venvs/demo-*) ;;
              *) echo "share project not redirected: $got"; exit 1 ;;
            esac

            # A nested subdir must resolve to the same project root.
            mkdir -p /work/demo/src/pkg
            nested=$(cd /work/demo/src/pkg && uv run true)
            test "$nested" = "$got" || { echo "nested subdir differs: $nested vs $got"; exit 1; }

            # A project on local disk keeps the default in-tree .venv.
            local_got=$(cd /local/demo && uv run true)
            test "$local_got" = "unset" || { echo "local project redirected: $local_got"; exit 1; }

            # An explicit choice always wins.
            explicit=$(cd /work/demo && UV_PROJECT_ENVIRONMENT=/tmp/mine uv run true)
            test "$explicit" = "/tmp/mine" || { echo "explicit env overridden: $explicit"; exit 1; }

            echo "uv wrapper OK"
          '

      # The conditional include is a backstop, not the main mechanism: git
      # probes the filesystem at `git init` and records core.filemode in the
      # repo's own config, and local config outranks system config. So the
      # include only decides repos where that key is absent - which is what
      # this asserts, by unsetting it. In CI /work is ordinary overlayfs, not
      # a share, so the probe would write `true` here and mask the include.
      - name: Smoke test - git fileMode include scoped to the share
        run: |
          docker run --rm --entrypoint sh "$IMAGE:latest" -c '
            set -eu
            git config --system --get filter.lfs.clean >/dev/null \
              || { echo "git-lfs system config was clobbered"; exit 1; }

            mkdir -p /work/repo /local/repo
            git -C /work/repo init -q
            git -C /local/repo init -q
            git -C /work/repo config --local --unset core.fileMode || true
            git -C /local/repo config --local --unset core.fileMode || true

            share=$(git -C /work/repo config --get core.fileMode || echo unset)
            test "$share" = "false" || { echo "include did not apply under /work: $share"; exit 1; }

            outside=$(git -C /local/repo config --get core.fileMode || echo unset)
            test "$outside" = "unset" || { echo "include leaked outside /work: $outside"; exit 1; }

            echo "git fileMode scoping OK"
          '

      # tmux is what keeps a session alive across an SSH disconnect, and a
      # config that fails to load is invisible until a TUI misbehaves hours
      # later. Assert the settings that actually took effect, not the file.
      - name: Smoke test - tmux defaults load
        run: |
          docker run --rm --entrypoint sh "$IMAGE:latest" -c '
            set -eu
            test -f /etc/tmux.conf || { echo "/etc/tmux.conf missing"; exit 1; }

            # A load error goes to stderr and still yields a session, so
            # capture it rather than trusting the exit status.
            err=$(tmux -L ci new-session -d -s probe 2>&1 || true)
            test -z "$err" || { echo "tmux reported config errors: $err"; exit 1; }

            check() {
              got=$(tmux -L ci show-options "$1" "$2")
              test "$got" = "$2 $3" || { echo "$2: expected $3, got: $got"; exit 1; }
            }
            check -g history-limit 50000
            check -g allow-passthrough on
            check -g set-clipboard on
            check -s extended-keys on
            check -s escape-time 0

            tmux -L ci show-options -s terminal-features | grep -q extkeys \
              || { echo "terminal-features missing extkeys"; exit 1; }
            tmux -L ci list-keys -T root | grep -q S-Enter \
              || { echo "S-Enter is not bound"; exit 1; }

            # Plain-English session commands. Assert they RESOLVE, not just
            # that the option is set - a typo in the alias body registers
            # fine and only fails when someone types the command.
            ca=$(tmux -L ci show-options -s command-alias)
            for want in "instance=new-session -A -s" "resume=attach -d -t" "sessions=list-sessions"; do
              echo "$ca" | grep -q "$want" || { echo "command-alias missing: $want"; exit 1; }
            done
            tmux -L ci sessions | grep -q probe \
              || { echo "tmux sessions did not resolve"; exit 1; }
            tmux -L ci resume nosuch 2>&1 | grep -q "find session" \
              || { echo "tmux resume did not resolve to attach-session"; exit 1; }
            tmux -L ci instance nosuch 2>&1 | grep -q terminal \
              || { echo "tmux instance did not resolve to new-session"; exit 1; }

            # And that adding them did not shadow the built-ins. No apostrophes
            # anywhere in this script: it is the body of sh -c in single
            # quotes, and one of them ends the string early.
            tmux -L ci new -d -s stdform >/dev/null 2>&1
            tmux -L ci has-session -t stdform 2>/dev/null \
              || { echo "the built-in new -s form was broken by the aliases"; exit 1; }

            tmux -L ci kill-server
            echo "tmux defaults OK"
          '

      # The command-alias entries above cannot serve the FIRST command of a
      # session: with no server running the client cannot resolve an unknown
      # name, so it tries to connect and fails. The shell function covers that.
      # This step exists because the original tests all pre-started a server
      # and so never exercised the one path a user actually starts from.
      - name: Smoke test - tmux session commands work from cold
        run: |
          docker run --rm --entrypoint sh "$IMAGE:latest" -c '
            set -eu
            # No apostrophes anywhere in this script: it is the body of sh -c
            # in single quotes, and one of them would end the string early.
            test -r /etc/devbox/tmux-commands.sh \
              || { echo "/etc/devbox/tmux-commands.sh missing"; exit 1; }

            # Defined in both shell shapes: login via profile.d, interactive
            # non-login via bash.bashrc.
            t=$(bash -lc "type -t tmux")
            test "$t" = "function" || { echo "login shell: tmux is [$t]"; exit 1; }
            t=$(bash -ic "type -t tmux" 2>/dev/null)
            test "$t" = "function" || { echo "interactive shell: tmux is [$t]"; exit 1; }

            # Translation, verified by stubbing the binary the function calls.
            mkdir -p /tmp/stub
            printf "#!/bin/sh\necho ARGS: \$*\n" > /tmp/stub/tmux
            chmod +x /tmp/stub/tmux
            # PATH must be set INSIDE the login shell: profile.d exports an
            # absolute PATH, so a leading PATH=... on the outside is discarded
            # and the real tmux runs instead of the stub.
            expect() {
              got=$(bash -lc "PATH=/tmp/stub:\$PATH; $1")
              test "$got" = "ARGS: $2" || { echo "[$1] gave [$got], wanted [ARGS: $2]"; exit 1; }
            }
            expect "tmux instance demo" "new-session -A -s demo"
            expect "tmux resume demo"   "attach-session -d -t demo"
            expect "tmux sessions"      "list-sessions"
            expect "tmux new -s native" "new -s native"

            # From cold with the REAL tmux, the only failure may be the absent
            # TTY. A connect error would mean no server was started at all -
            # the exact bug this step guards.
            mkdir -p /tmp/cold
            out=$(TMUX_TMPDIR=/tmp/cold bash -lc "tmux instance demo" 2>&1 || true)
            case "$out" in
              *"error connecting"*)
                echo "cold start still cannot start a server: $out"; exit 1 ;;
            esac
            ls -d /tmp/cold/tmux-* >/dev/null 2>&1 \
              || { echo "no tmux server socket dir was created from cold"; exit 1; }

            echo "tmux session commands OK"
          '

      - name: Push
        run: |
          for t in $TAGS; do docker push "$IMAGE:$t"; done
          {
            echo "### Pushed"
            for t in $TAGS; do echo "- \`$IMAGE:$t\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY" || true
